<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore VP | Bird Migration Modelling</title>
    <meta
      name="description"
      content="Explore the vertical profile time series of nocturnal bird density measured by European weather radars in 2018 and 2019."
    />
    <meta name="theme-color" content="#151515" />
    <link rel="canonical" href="https://birdmigrationmap.vogelwarte.ch/explore-vp/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Explore VP | Bird Migration Modelling" />
    <meta
      property="og:description"
      content="Vertical profile time series of bird density for each European weather radar."
    />
    <meta property="og:url" content="https://birdmigrationmap.vogelwarte.ch/explore-vp/" />
    <meta property="og:image" content="https://birdmigrationmap.vogelwarte.ch/assets/avatar_vpexplore.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./evp.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EFQJ28R6D2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-EFQJ28R6D2");
    </script>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="../" title="Back to Bird Migration Modelling">BMM.</a>
      <h1>Vertical profiles of bird density</h1>
      <a class="source" href="https://doi.org/10.5281/zenodo.3610184" target="_blank" rel="noopener"
        >2018 data archived on Zenodo</a
      >

      <form class="controls" id="controls">
        <label>
          <span>Dataset</span>
          <select id="dataset">
            <option value="vp-raw">2018 raw</option>
            <option value="vp-clean">2018 cleaned</option>
            <option value="vp-2019">2019 raw</option>
          </select>
        </label>

        <label>
          <span>Radar</span>
          <select id="radar"></select>
        </label>

        <button type="button" id="open-map" title="Choose radar on map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14" /></svg>
          Map
        </button>

        <label class="check"><input type="checkbox" id="hide-zero" /> Hide zeros</label>
        <label class="check"><input type="checkbox" id="log-scale" /> Log scale</label>

        <label>
          <span>Colour range [bird/km³]</span>
          <span class="range">
            <input type="number" id="range-from" min="0" step="any" value="0" aria-label="Minimum" />
            <span aria-hidden="true">–</span>
            <input type="number" id="range-to" min="0" step="any" value="200" aria-label="Maximum" />
          </span>
        </label>

        <button type="button" id="open-coverage" title="Data coverage of all radars">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 12h16M4 18h7" /></svg>
          Coverage
        </button>
      </form>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="plot"></div>
    </main>

    <dialog id="map-dialog" aria-labelledby="map-title">
      <header>
        <h2 id="map-title">Choose a radar</h2>
        <button type="button" class="close" data-close aria-label="Close">×</button>
      </header>
      <p class="hint">Click a radar to see its details, then load it. Only radars with data for the selected dataset are shown.</p>
      <div id="map"></div>
    </dialog>

    <dialog id="coverage-dialog" aria-labelledby="coverage-title">
      <header>
        <h2 id="coverage-title">Data coverage</h2>
        <button type="button" class="close" data-close aria-label="Close">×</button>
      </header>
      <figure>
        <img src="./assets/Coverage2018.png" alt="Timeline of data availability for each radar in 2018" />
        <figcaption>2018</figcaption>
      </figure>
      <figure>
        <img src="./assets/Coverage2019.png" alt="Timeline of data availability for each radar in 2019" />
        <figcaption>2019</figcaption>
      </figure>
    </dialog>

    <script src="./vendor/plotly-cartesian.min.js"></script>
    <script src="./vendor/leaflet/leaflet.js"></script>
    <script src="./evp.js"></script>
  </body>
</html>
